<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Sphere Viewer Debug</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        #app {
            width: 100%;
            height: 100%;
        }

        #debug {
            position: fixed;
            top: 0;
            left: 0;
            max-width: 420px;
            max-height: 100vh;
            overflow: auto;
            background: rgba(0, 0, 0, 0.75);
            color: #00ff88;
            font: 12px/1.4 monospace;
            padding: 10px;
            white-space: pre-wrap;
            z-index: 9999;
            border-right: 1px solid rgba(255,255,255,0.15);
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>
<div id="app"></div>
<pre id="debug"></pre>

<script type="module">
    import * as THREE from 'https://esm.sh/three@0.160.0';
    import { OrbitControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    const API_URL = 'http://localhost:8080/sphere';
    const debugEl = document.getElementById('debug');
    const appEl = document.getElementById('app');

    function log(...args) {
        const line = args.map(formatValue).join(' ');
        console.log(...args);
        debugEl.textContent += line + '\n';
    }

    function formatValue(value) {
        if (value instanceof Error) {
            return `${value.name}: ${value.message}\n${value.stack ?? ''}`;
        }
        if (typeof value === 'object' && value !== null) {
            try {
                return JSON.stringify(value, null, 2);
            } catch {
                return String(value);
            }
        }
        return String(value);
    }

    window.addEventListener('error', (event) => {
        log('[window.error]', event.message, 'at', `${event.filename}:${event.lineno}:${event.colno}`);
    });

    window.addEventListener('unhandledrejection', (event) => {
        log('[unhandledrejection]', event.reason);
    });

    log('[init] page loaded');
    log('[init] API_URL =', API_URL);
    log('[init] userAgent =', navigator.userAgent);
    log('[init] location =', window.location.href);

    // -----------------------------
    // SCENE
    // -----------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    log('[scene] created');

    const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );
    camera.position.set(0, 0, 3);
    camera.lookAt(0, 0, 0);
    log('[camera] created', {
        fov: camera.fov,
        aspect: camera.aspect,
        near: camera.near,
        far: camera.far,
        position: camera.position
    });

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.setSize(window.innerWidth, window.innerHeight);
    appEl.appendChild(renderer.domElement);
    log('[renderer] created', {
        width: window.innerWidth,
        height: window.innerHeight,
        pixelRatio: window.devicePixelRatio || 1
    });

    // -----------------------------
    // CONTROLS
    // -----------------------------
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = false;
    log('[controls] OrbitControls initialized');

    // -----------------------------
    // HELPERS
    // -----------------------------
    const axesHelper = new THREE.AxesHelper(2);
    scene.add(axesHelper);
    log('[scene] axesHelper added');

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    log('[scene] ambientLight added');

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
    directionalLight.position.set(5, 5, 5);
    scene.add(directionalLight);
    log('[scene] directionalLight added', {
        position: directionalLight.position
    });

    // -----------------------------
    // FETCH DATA
    // -----------------------------
    let data;

    try {
        log('[fetch] requesting', API_URL);
        const response = await fetch(API_URL, {
            method: 'GET',
            headers: {
                'Accept': 'application/json'
            }
        });

        log('[fetch] response status =', response.status, response.statusText);
        log('[fetch] content-type =', response.headers.get('content-type'));

        if (!response.ok) {
            throw new Error(`HTTP ${response.status} ${response.statusText}`);
        }

        data = await response.json();
        log('[fetch] JSON loaded');

    } catch (error) {
        log('[fetch] failed', error);
        throw error;
    }

    // -----------------------------
    // VALIDATION
    // -----------------------------
    if (!data) {
        throw new Error('Backend returned empty response');
    }

    log('[data] top-level keys =', Object.keys(data));

    if (!Array.isArray(data.positions)) {
        throw new Error('data.positions is not an array');
    }
    if (!Array.isArray(data.indices)) {
        throw new Error('data.indices is not an array');
    }
    if (data.normals != null && !Array.isArray(data.normals)) {
        throw new Error('data.normals is not an array');
    }
    if (data.tileIds != null && !Array.isArray(data.tileIds)) {
        throw new Error('data.tileIds is not an array');
    }

    log('[data] lengths', {
        positions: data.positions.length,
        normals: data.normals?.length ?? 0,
        indices: data.indices.length,
        tileIds: data.tileIds?.length ?? 0
    });

    if (data.positions.length === 0) {
        throw new Error('positions is empty');
    }
    if (data.indices.length === 0) {
        throw new Error('indices is empty');
    }
    if (data.positions.length % 3 !== 0) {
        throw new Error(`positions length must be multiple of 3, got ${data.positions.length}`);
    }
    if (data.normals && data.normals.length > 0 && data.normals.length !== data.positions.length) {
        throw new Error(`normals length (${data.normals.length}) must equal positions length (${data.positions.length})`);
    }
    if (data.indices.length % 3 !== 0) {
        throw new Error(`indices length must be multiple of 3, got ${data.indices.length}`);
    }

    const vertexCount = data.positions.length / 3;
    const triangleCount = data.indices.length / 3;
    const maxIndex = Math.max(...data.indices);
    const minIndex = Math.min(...data.indices);

    log('[data] mesh stats', {
        vertexCount,
        triangleCount,
        minIndex,
        maxIndex
    });

    if (minIndex < 0) {
        throw new Error(`indices contain negative value: ${minIndex}`);
    }
    if (maxIndex >= vertexCount) {
        throw new Error(`indices out of bounds: maxIndex=${maxIndex}, vertexCount=${vertexCount}`);
    }

    for (let i = 0; i < Math.min(30, data.positions.length); i++) {
        const v = data.positions[i];
        if (!Number.isFinite(v)) {
            throw new Error(`positions[${i}] is not finite: ${v}`);
        }
    }

    for (let i = 0; i < Math.min(30, data.indices.length); i++) {
        const idx = data.indices[i];
        if (!Number.isInteger(idx)) {
            throw new Error(`indices[${i}] is not integer: ${idx}`);
        }
    }

    // -----------------------------
    // GEOMETRY
    // -----------------------------
    const geometry = new THREE.BufferGeometry();

    const positionsArray = new Float32Array(data.positions);
    geometry.setAttribute(
        'position',
        new THREE.BufferAttribute(positionsArray, 3)
    );
    log('[geometry] position attribute set');

    if (data.normals && data.normals.length > 0) {
        geometry.setAttribute(
            'normal',
            new THREE.BufferAttribute(new Float32Array(data.normals), 3)
        );
        log('[geometry] normal attribute set from backend');
    } else {
        geometry.computeVertexNormals();
        log('[geometry] normals computed on frontend');
    }

    geometry.setIndex(data.indices);
    log('[geometry] index set');

    geometry.computeBoundingBox();
    geometry.computeBoundingSphere();

    log('[geometry] boundingBox =', geometry.boundingBox
        ? {
            min: geometry.boundingBox.min,
            max: geometry.boundingBox.max
        }
        : 'null'
    );

    log('[geometry] boundingSphere =', geometry.boundingSphere
        ? {
            center: geometry.boundingSphere.center,
            radius: geometry.boundingSphere.radius
        }
        : 'null'
    );

    // -----------------------------
    // MATERIAL
    // -----------------------------
    const material = new THREE.MeshBasicMaterial({
        color: 0x00ff66,
        wireframe: true
    });
    log('[material] MeshBasicMaterial created');

    // -----------------------------
    // MESH
    // -----------------------------
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);
    log('[scene] mesh added');

    const box = new THREE.BoxHelper(mesh, 0xffff00);
    scene.add(box);
    log('[scene] box helper added');

    if (geometry.boundingSphere) {
        const sphereRadius = geometry.boundingSphere.radius;
        const camDistance = Math.max(3, sphereRadius * 2.5);
        camera.position.set(0, 0, camDistance);
        camera.lookAt(0, 0, 0);
        controls.update();
        log('[camera] repositioned by bounding sphere', {
            sphereRadius,
            camDistance,
            cameraPosition: camera.position
        });
    }

    // -----------------------------
    // RENDER LOOP
    // -----------------------------
    let frame = 0;

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);

        if (frame === 0) {
            log('[render] first frame rendered');
        }
        frame++;
    }

    animate();

    // -----------------------------
    // RESIZE
    // -----------------------------
    window.addEventListener('resize', () => {
        const width = window.innerWidth;
        const height = window.innerHeight;

        camera.aspect = width / height;
        camera.updateProjectionMatrix();

        renderer.setSize(width, height);
        log('[resize]', { width, height, aspect: camera.aspect });
    });
</script>

</body>
</html>
