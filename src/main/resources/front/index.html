<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KTX2 Sphere Viewer</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        #tooltip {
            position: absolute;
            display: none;
            pointer-events: none;
            z-index: 20;
            max-width: 380px;
            padding: 8px 10px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.82);
            color: #fff;
            font-size: 13px;
            line-height: 1.35;
            white-space: normal;
            word-break: break-word;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        }

        #panel {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            font-size: 13px;
            line-height: 1.45;
            min-width: 280px;
        }

        #panel h3 {
            margin: 0 0 8px;
            font-size: 15px;
            font-weight: 700;
        }

        #panel .row {
            margin: 4px 0;
        }

        #panel .status-ok {
            color: #7CFC8A;
        }

        #panel .status-warn {
            color: #FFD166;
        }

        #panel .status-error {
            color: #FF6B6B;
        }
    </style>
</head>
<body>
<div id="tooltip"></div>

<div id="panel">
    <h3>KTX2 Sphere Viewer</h3>
    <div class="row">ЛКМ + drag: вращение</div>
    <div class="row">Колесо: зум</div>
    <div class="row">Hover: areaId / groupId / url</div>
    <div class="row">Click: открыть url</div>
    <div class="row" id="status">Статус: инициализация...</div>
    <div class="row" id="stats"></div>
    <div class="row" id="mappingStats"></div>
</div>

<script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.7.3/build/index.module.js"
      }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
    import { computeBoundsTree, disposeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';

    THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
    THREE.BufferGeometry.prototype.disposeBoundsTree = disposeBoundsTree;
    THREE.Mesh.prototype.raycast = acceleratedRaycast;

    const API_BASE = 'http://localhost:8080';

    const tooltipEl = document.getElementById('tooltip');
    const statusEl = document.getElementById('status');
    const statsEl = document.getElementById('stats');
    const mappingStatsEl = document.getElementById('mappingStats');

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );
    camera.position.set(0, 0, 3);

    const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.rotateSpeed = 0.8;

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    const dir = new THREE.DirectionalLight(0xffffff, 0.8);
    dir.position.set(5, 5, 5);
    scene.add(dir);

    scene.background = new THREE.Color(0x222222);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    let sphereResponse = null;
    let atlasInfo = null;
    let atlasTexture = null;
    let sphereMesh = null;
    let hoverOverlayMesh = null;

    // triangle index -> areaId
    let triangleAreaIds = [];

    // areaId -> metadata
    const areaMetaById = new Map();

    // groupId -> atlasCoords
    const groupAtlasById = new Map();

    // areaId -> raw area
    const areaRawById = new Map();

    let hoveredAreaId = null;

    init().catch((error) => {
        console.error(error);
        setStatus(`Ошибка инициализации: ${error.message}`, 'error');
    });

    animate();

    async function init() {
        setStatus('Загрузка /sphere и /atlas/info...', 'warn');

        const [sphereJson, atlasJson] = await Promise.all([
            fetchJson(`${API_BASE}/sphere`),
            fetchJson(`${API_BASE}/atlas/info`)
        ]);

        sphereResponse = sphereJson;
        atlasInfo = atlasJson;

        validateSphereResponse(sphereResponse);
        validateAtlasInfo(atlasInfo);

        buildMaps();

        setStatus('Загрузка atlas texture...', 'warn');
        atlasTexture = await loadAtlasTexture();

        setStatus('Сборка single mesh...', 'warn');
        buildSingleMesh();

        updateStats();
        setStatus('Готово', 'ok');

        window.addEventListener('mousemove', onMouseMove, { passive: true });
        window.addEventListener('click', onClick);
        window.addEventListener('resize', onResize);
    }

    async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) {
            throw new Error(`${url} -> HTTP ${response.status}`);
        }
        return response.json();
    }

    function validateSphereResponse(data) {
        if (!data || !Array.isArray(data.areas)) {
            throw new Error('/sphere вернул некорректный JSON: отсутствует areas[]');
        }
    }

    function validateAtlasInfo(data) {
        if (!data || !Array.isArray(data.groups)) {
            throw new Error('/atlas/info вернул некорректный JSON: отсутствует groups[]');
        }
    }

    function buildMaps() {
        areaMetaById.clear();
        groupAtlasById.clear();
        areaRawById.clear();

        for (const group of atlasInfo.groups) {
            if (group?.groupId == null || !group.atlasCoords) {
                continue;
            }
            groupAtlasById.set(Number(group.groupId), group.atlasCoords);
        }

        for (const area of sphereResponse.areas) {
            if (!area || area.areaId == null) {
                continue;
            }

            const resolvedGroupId = resolveGroupId(area);

            areaRawById.set(area.areaId, area);

            areaMetaById.set(area.areaId, {
                areaId: Number(area.areaId),
                groupId: resolvedGroupId,
                userId: area.userId ?? null,
                url: area.url ?? null
            });
        }
    }

    function resolveGroupId(area) {
        if (area.groupId != null) {
            return Number(area.groupId);
        }

        // fallback для текущего JSON, где groupId отсутствует
        if (area.areaId != null) {
            return Number(area.areaId);
        }

        return null;
    }

    async function loadAtlasTexture() {
        const ktx2Loader = new KTX2Loader()
            .setTranscoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/basis/')
            .detectSupport(renderer);

        try {
            const texture = await ktx2Loader.loadAsync(`${API_BASE}/atlas`);
            configureTexture(texture);
            return texture;
        } catch (error) {
            console.warn('KTX2 не загрузился, fallback на PNG', error);

            const texture = await new THREE.TextureLoader().loadAsync(`${API_BASE}/atlas?type=png`);
            configureTexture(texture);
            return texture;
        }
    }

    function configureTexture(texture) {
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.minFilter = THREE.LinearMipmapLinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        texture.wrapS = THREE.ClampToEdgeWrapping;
        texture.wrapT = THREE.ClampToEdgeWrapping;
        texture.needsUpdate = true;
    }

    function buildSingleMesh() {
        const positions = [];
        const normals = [];
        const uvs = [];
        const indices = [];

        triangleAreaIds = [];

        let vertexOffset = 0;
        let mappedAreas = 0;
        let unmappedAreas = 0;

        for (const area of sphereResponse.areas) {
            if (!area?.vertices || !area?.uv || !area?.triangles) {
                console.warn(`Area ${area?.areaId}: отсутствуют vertices/uv/triangles, area пропущена`);
                unmappedAreas++;
                continue;
            }

            if (area.vertices.length !== area.uv.length) {
                console.warn(`Area ${area.areaId}: vertices.length !== uv.length, area пропущена`);
                unmappedAreas++;
                continue;
            }

            const groupId = resolveGroupId(area);
            const atlasCoords = groupId != null ? groupAtlasById.get(groupId) : null;

            if (!atlasCoords) {
                console.warn(`Area ${area.areaId}: не найден atlasCoords для groupId=${groupId}`);
                unmappedAreas++;
                continue;
            }

            if (!isValidAtlasCoords(atlasCoords)) {
                console.warn(`Area ${area.areaId}: atlasCoords невалидны`, atlasCoords);
                unmappedAreas++;
                continue;
            }

            const localBase = vertexOffset;

            for (let i = 0; i < area.vertices.length; i++) {
                const vertex = area.vertices[i];
                const uv = area.uv[i];

                if (!isFiniteNumber(vertex.x) || !isFiniteNumber(vertex.y) || !isFiniteNumber(vertex.z)) {
                    throw new Error(`Area ${area.areaId}: невалидная вершина на индексе ${i}`);
                }

                if (!isFiniteNumber(uv.u) || !isFiniteNumber(uv.v)) {
                    throw new Error(`Area ${area.areaId}: невалидный uv на индексе ${i}`);
                }

                positions.push(vertex.x, vertex.y, vertex.z);

                const len = Math.hypot(vertex.x, vertex.y, vertex.z) || 1.0;
                normals.push(vertex.x / len, vertex.y / len, vertex.z / len);

                const uFinal = atlasCoords.u1 + uv.u * (atlasCoords.u2 - atlasCoords.u1);
                const vFinal = atlasCoords.v1 + uv.v * (atlasCoords.v2 - atlasCoords.v1);

                // В backend atlasCoords уже в bottom-left UV.
                // Здесь второй flip делать нельзя.
                uvs.push(uFinal, 1 - vFinal);
            }

            if (area.triangles.length % 3 !== 0) {
                throw new Error(`Area ${area.areaId}: triangles.length не кратен 3`);
            }

            for (let i = 0; i < area.triangles.length; i += 3) {
                const a = area.triangles[i];
                const b = area.triangles[i + 1];
                const c = area.triangles[i + 2];

                if (
                    !Number.isInteger(a) || !Number.isInteger(b) || !Number.isInteger(c) ||
                    a < 0 || b < 0 || c < 0 ||
                    a >= area.vertices.length || b >= area.vertices.length || c >= area.vertices.length
                ) {
                    throw new Error(`Area ${area.areaId}: triangle index out of range: [${a}, ${b}, ${c}]`);
                }

                indices.push(
                    localBase + a,
                    localBase + b,
                    localBase + c
                );

                triangleAreaIds.push(area.areaId);
            }

            vertexOffset += area.vertices.length;
            mappedAreas++;
        }

        console.log('Mapped:', mappedAreas);
        console.log('Unmapped:', unmappedAreas);
        console.log('Triangles:', triangleAreaIds.length);
        console.log('AreaIds:', sphereResponse.areas.length);

        mappingStatsEl.textContent = `Mapped: ${mappedAreas} | Unmapped: ${unmappedAreas}`;

        if (mappedAreas === 0) {
            throw new Error('Не удалось собрать ни одного area: проверь маппинг areaId/groupId');
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
        geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        geometry.setIndex(indices);
        geometry.computeBoundingSphere();
        geometry.computeBoundsTree();

        const material = new THREE.MeshBasicMaterial({
            map: atlasTexture,
            side: THREE.FrontSide
        });

        sphereMesh = new THREE.Mesh(geometry, material);
        sphereMesh.name = 'sphere-main';
        scene.add(sphereMesh);
    }

    function isValidAtlasCoords(c) {
        return c
            && isFiniteNumber(c.u1)
            && isFiniteNumber(c.v1)
            && isFiniteNumber(c.u2)
            && isFiniteNumber(c.v2)
            && c.u1 >= 0
            && c.v1 >= 0
            && c.u2 <= 1
            && c.v2 <= 1
            && c.u1 < c.u2
            && c.v1 < c.v2;
    }

    function isFiniteNumber(value) {
        return Number.isFinite(value);
    }

    function getHoveredArea(event) {
        if (!sphereMesh) return null;

        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        const hits = raycaster.intersectObject(sphereMesh, false);
        if (!hits.length) return null;

        const hit = hits[0];
        if (hit.faceIndex == null) return null;

        const areaId = triangleAreaIds[hit.faceIndex];
        if (areaId == null) return null;

        const meta = areaMetaById.get(areaId);
        if (!meta) return null;

        return {
            ...meta,
            point: hit.point
        };
    }

    function onMouseMove(event) {
        const area = getHoveredArea(event);

        if (!area) {
            hoveredAreaId = null;
            hideTooltip();
            removeHoverOverlay();
            document.body.style.cursor = 'default';
            return;
        }

        hoveredAreaId = area.areaId;
        showTooltip(event, area);
        updateHoverOverlay(area.areaId);
        document.body.style.cursor = area.url ? 'pointer' : 'default';
    }

    function onClick(event) {
        const area = getHoveredArea(event);
        if (area?.url) {
            window.open(area.url, '_blank', 'noopener,noreferrer');
        }
    }

    function showTooltip(event, area) {
        let html = `Area ID: ${escapeHtml(String(area.areaId))}`;

        if (area.groupId != null) {
            html += `<br>Group ID: ${escapeHtml(String(area.groupId))}`;
        }

        if (area.userId != null) {
            html += `<br>User ID: ${escapeHtml(String(area.userId))}`;
        }

        if (area.url) {
            html += `<br>URL: ${escapeHtml(area.url)}`;
        }

        tooltipEl.innerHTML = html;
        tooltipEl.style.display = 'block';
        tooltipEl.style.left = `${event.clientX + 12}px`;
        tooltipEl.style.top = `${event.clientY + 12}px`;
    }

    function hideTooltip() {
        tooltipEl.style.display = 'none';
    }

    function removeHoverOverlay() {
        if (!hoverOverlayMesh) return;

        scene.remove(hoverOverlayMesh);
        hoverOverlayMesh.geometry.dispose();
        hoverOverlayMesh.material.dispose();
        hoverOverlayMesh = null;
    }

    function updateHoverOverlay(areaId) {
        if (hoverOverlayMesh && hoverOverlayMesh.userData.areaId === areaId) {
            return;
        }

        removeHoverOverlay();

        const area = areaRawById.get(areaId);
        if (!area || !area.vertices || !area.triangles) {
            return;
        }

        const positions = [];
        const indices = [];

        for (const v of area.vertices) {
            const scale = 1.002;
            positions.push(v.x * scale, v.y * scale, v.z * scale);
        }

        for (let i = 0; i < area.triangles.length; i++) {
            indices.push(area.triangles[i]);
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();

        const material = new THREE.MeshBasicMaterial({
            color: 0xffff00,
            side: THREE.FrontSide,
            transparent: true,
            opacity: 0.28,
            depthWrite: false
        });

        hoverOverlayMesh = new THREE.Mesh(geometry, material);
        hoverOverlayMesh.userData.areaId = areaId;
        scene.add(hoverOverlayMesh);
    }

    function updateStats() {
        const areaCount = sphereResponse?.areas?.length ?? 0;
        const groupCount = atlasInfo?.groups?.length ?? 0;
        const triangleCount = triangleAreaIds.length;
        const atlasWidth = atlasInfo?.atlasWidth ?? '?';
        const atlasHeight = atlasInfo?.atlasHeight ?? '?';

        statsEl.textContent =
            `Areas: ${areaCount} | Groups: ${groupCount} | Triangles: ${triangleCount} | Atlas: ${atlasWidth}x${atlasHeight}`;
    }

    function setStatus(message, level = 'warn') {
        statusEl.textContent = `Статус: ${message}`;
        statusEl.className = 'row';

        if (level === 'ok') {
            statusEl.classList.add('status-ok');
        } else if (level === 'error') {
            statusEl.classList.add('status-error');
        } else {
            statusEl.classList.add('status-warn');
        }
    }

    function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    function escapeHtml(value) {
        return value
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }
</script>
</body>
</html>
