<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Moon Atlas</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
            display: none;
        }
        #controls-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #aaa;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="info">uvId: <span id="uvId"></span></div>
    <div id="controls-info">Rotate: Left Mouse | Zoom: Scroll | Pan: Right Mouse</div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls, raycaster, mouse;
        let moonMesh, infoDiv, uvIdSpan;

        init();

        async function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 2;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            infoDiv = document.getElementById('info');
            uvIdSpan = document.getElementById('uvId');

            try {
                const response = await fetch('http://localhost:8080/api/moon/data');
                const data = await response.json();

                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(data.positions), 3));
                geometry.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(data.uv), 2));
                geometry.setIndex(new THREE.BufferAttribute(new Uint32Array(data.indices), 1));

                // Add uvId as a custom attribute for easier lookup during raycasting
                // Since we have one uvId per face (3 indices), we'll store it in the mesh data
                const uvIds = data.uvIds;

                const textureLoader = new THREE.TextureLoader();
                // const texture = textureLoader.load('http://localhost:8080/generated/atlas.png');
                const texture = textureLoader.load('atlas.png');
                texture.colorSpace = THREE.SRGBColorSpace;
                
                const material = new THREE.MeshPhongMaterial({
                    map: texture,
                    side: THREE.DoubleSide
                });

                moonMesh = new THREE.Mesh(geometry, material);
                moonMesh.userData.uvIds = uvIds; // Store for lookup
                scene.add(moonMesh);

                window.addEventListener('mousemove', onMouseMove);
                animate();
            } catch (error) {
                console.error('Error loading model data:', error);
            }
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            if (moonMesh) {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(moonMesh);

                if (intersects.length > 0) {
                    const faceIndex = intersects[0].faceIndex;
                    const uvId = moonMesh.userData.uvIds[faceIndex];
                    uvIdSpan.textContent = uvId;
                    infoDiv.style.display = 'block';
                    infoDiv.style.left = (event.clientX + 10) + 'px';
                    infoDiv.style.top = (event.clientY + 10) + 'px';
                } else {
                    infoDiv.style.display = 'none';
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
