<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Sphere Atlas</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        canvas { display: block; }
        #tooltip {
            position: absolute;
            padding: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border-radius: 4px;
            pointer-events: none;
            display: none;
            z-index: 100;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="tooltip"></div>
    <div id="info">Hover over the sphere. Click on colored areas.</div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls, raycaster, mouse;
        let sphereGroup = new THREE.Group();
        let areas = [];
        const tooltip = document.getElementById('tooltip');

        init();

        async function init() {
            // Scene setup
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 3;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);

            scene.add(sphereGroup);

            // Fetch data
            try {
                const sphereRes = await fetch('http://localhost:8080/sphere');
                const sphereData = await sphereRes.json();
                
                const atlasRes = await fetch('http://localhost:8080/atlas');
                const atlasBlob = await atlasRes.blob();
                const atlasUrl = URL.createObjectURL(atlasBlob);
                const atlasTexture = new THREE.TextureLoader().load(atlasUrl);
                atlasTexture.colorSpace = THREE.SRGBColorSpace;

                renderSphere(sphereData.areas, atlasTexture);
            } catch (err) {
                console.error("Error loading data:", err);
            }

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onClick);
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function renderSphere(sphereAreas, atlasTexture) {
            const material = new THREE.MeshBasicMaterial({ 
                map: atlasTexture, 
                side: THREE.DoubleSide,
                transparent: true,
                alphaTest: 0.1
            });
            
            const wireMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x444444, 
                wireframe: true,
                transparent: true,
                opacity: 0.3
            });

            sphereAreas.forEach(area => {
                const geometry = new THREE.BufferGeometry();
                const vertices = [];
                const uvs = [];
                const indices = [];

                // Simple triangulation for polygon
                // For a convex polygon with N vertices: (0, 1, 2), (0, 2, 3), ..., (0, N-2, N-1)
                area.vertices.forEach((v, i) => {
                    vertices.push(v.x, v.y, v.z);
                    
                    // Calculate UVs based on spherical coordinates
                    let phi = Math.acos(v.y);
                    let theta = Math.atan2(v.z, v.x);
                    if (theta < 0) theta += 2 * Math.PI;
                    
                    uvs.push(theta / (2 * Math.PI), 1 - (phi / Math.PI));

                    if (i >= 2) {
                        indices.push(0, i - 1, i);
                    }
                });

                geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
                geometry.setIndex(indices);
                geometry.computeVertexNormals();

                const mesh = new THREE.Mesh(geometry, material);
                mesh.userData = {
                    areaId: area.areaId,
                    groupId: area.groupId,
                    url: area.url,
                    userId: area.userId
                };
                
                // Add a wireframe helper
                const wireframe = new THREE.Mesh(geometry, wireMaterial);
                mesh.add(wireframe);

                sphereGroup.add(mesh);
                areas.push(mesh);
            });
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(areas);

            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                tooltip.style.display = 'block';
                tooltip.style.left = (event.clientX + 10) + 'px';
                tooltip.style.top = (event.clientY + 10) + 'px';
                
                let content = `Area ID: ${data.areaId}`;
                if (data.groupId) {
                    content += `<br>Group ID: ${data.groupId}<br>URL: ${data.url}`;
                }
                tooltip.innerHTML = content;
                document.body.style.cursor = data.url ? 'pointer' : 'default';
            } else {
                tooltip.style.display = 'none';
                document.body.style.cursor = 'default';
            }
        }

        function onClick(event) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(areas);

            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                if (data.url) {
                    window.open(data.url, '_blank');
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
