<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Sphere Tiles</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
    </style>
</head>
<body>

<script type="module">
    import * as THREE from 'https://esm.sh/three@0.160.0';
    import { OrbitControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    const API_URL = 'http://localhost:8080/sphere';

    // -----------------------------
    // scene
    // -----------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    camera.position.set(0, 0, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // -----------------------------
    // controls
    // -----------------------------
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enablePan = false;

    // -----------------------------
    // lights
    // -----------------------------
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 5, 5);
    scene.add(dirLight);

    // -----------------------------
    // fetch geometry
    // -----------------------------
    const data = await fetch(API_URL).then(r => r.json());

    // -----------------------------
    // validation
    // -----------------------------
    if (!data.positions || !data.indices) {
        throw new Error('Invalid mesh data');
    }

    // -----------------------------
    // geometry
    // -----------------------------
    let geometry = new THREE.BufferGeometry();

    geometry.setAttribute(
        'position',
        new THREE.BufferAttribute(new Float32Array(data.positions), 3)
    );

    if (data.normals && data.normals.length > 0) {
        geometry.setAttribute(
            'normal',
            new THREE.BufferAttribute(new Float32Array(data.normals), 3)
        );
    } else {
        geometry.computeVertexNormals();
    }

    geometry.setIndex(data.indices);

    // 🔴 КЛЮЧЕВОЕ: разворачиваем
    geometry = geometry.toNonIndexed();

    // -----------------------------
    // UV buffer (обязательно заранее)
    // -----------------------------
    const vertexCount = geometry.attributes.position.count;
    const uvArray = new Float32Array(vertexCount * 2);

    // -----------------------------
    // TILE → UV (если есть tileIds)
    // -----------------------------
    if (data.tileIds && data.tileIds.length > 0) {

        const triangleCount = vertexCount / 3;
        const tileCount = Math.max(...data.tileIds) + 1;

        // atlas grid
        const gridSize = Math.ceil(Math.sqrt(tileCount));

        function getTileUV(tileId) {
            const x = tileId % gridSize;
            const y = Math.floor(tileId / gridSize);

            const size = 1 / gridSize;

            return {
                u0: x * size,
                v0: y * size,
                u1: (x + 1) * size,
                v1: (y + 1) * size
            };
        }

        for (let t = 0; t < triangleCount; t++) {
            const tileId = data.tileIds[t];
            const rect = getTileUV(tileId);

            const base = t * 3;

            // triangle A / B автоматически корректно ложатся
            setUV(base + 0, rect.u0, rect.v0);
            setUV(base + 1, rect.u1, rect.v0);
            setUV(base + 2, rect.u0, rect.v1);
        }

        console.log('UV assigned for tiles');

    } else {
        console.log('No tileIds → fallback UV');

        // fallback UV
        for (let i = 0; i < vertexCount; i++) {
            setUV(i, 0, 0);
        }
    }

    function setUV(index, u, v) {
        uvArray[index * 2] = u;
        uvArray[index * 2 + 1] = v;
    }

    geometry.setAttribute('uv', new THREE.BufferAttribute(uvArray, 2));

    // -----------------------------
    // ATLAS (если есть картинки)
    // -----------------------------
    let material;

    try {
        const canvas = document.createElement('canvas');
        const size = 1024;

        canvas.width = size;
        canvas.height = size;

        const ctx = canvas.getContext('2d');

        // пример: закрасим разными цветами
        const tileCount = data.tileIds ? Math.max(...data.tileIds) + 1 : 0;
        const gridSize = Math.ceil(Math.sqrt(tileCount));

        for (let i = 0; i < tileCount; i++) {
            const x = i % gridSize;
            const y = Math.floor(i / gridSize);

            const cell = size / gridSize;

            ctx.fillStyle = `hsl(${(i * 37) % 360}, 70%, 50%)`;
            ctx.fillRect(x * cell, y * cell, cell, cell);
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.generateMipmaps = false;

        material = new THREE.MeshBasicMaterial({
            map: texture
        });

        console.log('Atlas created');

    } catch (e) {
        console.warn('Atlas failed → fallback color');

        material = new THREE.MeshBasicMaterial({
            color: 0x00ff66
        });
    }

    // -----------------------------
    // mesh
    // -----------------------------
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // -----------------------------
    // camera auto distance
    // -----------------------------
    geometry.computeBoundingSphere();

    if (geometry.boundingSphere) {
        const r = geometry.boundingSphere.radius;
        camera.position.set(0, 0, r * 2.5);
        controls.update();
    }

    // -----------------------------
    // render
    // -----------------------------
    function animate() {
        requestAnimationFrame(animate);

        controls.update();

        renderer.render(scene, camera);
    }

    animate();

    // -----------------------------
    // resize
    // -----------------------------
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
