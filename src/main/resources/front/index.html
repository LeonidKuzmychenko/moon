<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Sphere Tiles</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        #area-tooltip {
            position: fixed;
            left: 0;
            top: 0;
            transform: translate(12px, 12px);
            padding: 6px 8px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font: 12px/1.2 monospace;
            pointer-events: none;
            display: none;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
<div id="area-tooltip"></div>

<script type="module">
    import * as THREE from 'https://esm.sh/three@0.160.0';
    import { OrbitControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    const API_URL = 'http://localhost:8080/sphere';

    // -----------------------------
    // scene
    // -----------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    camera.position.set(0, 0, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // -----------------------------
    // controls
    // -----------------------------
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enablePan = false;

    // -----------------------------
    // lights
    // -----------------------------
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 5, 5);
    scene.add(dirLight);

    // -----------------------------
    // fetch geometry
    // -----------------------------
    const response = await fetch(API_URL);
    if (!response.ok) {
        throw new Error(`Sphere API failed: ${response.status}`);
    }
    const data = await response.json();

    // -----------------------------
    // validation + normalization
    // -----------------------------
    const toJsArray = (value) => {
        if (Array.isArray(value)) return value;
        if (ArrayBuffer.isView(value)) return Array.from(value);
        return null;
    };

    function normalizeMeshData(payload) {
        const positions = toJsArray(payload?.positions ?? payload?.vertices);
        const quads = toJsArray(payload?.quads ?? payload?.faces);
        const normals = toJsArray(payload?.normals ?? []);
        const areaIds = toJsArray(payload?.areaIds ?? payload?.tileIds ?? []);

        if (!positions || !quads) {
            const keys = payload && typeof payload === 'object'
                ? Object.keys(payload).join(', ')
                : String(payload);
            throw new Error(`Invalid mesh data: expected positions/quads, got keys: ${keys}`);
        }
        if (positions.length % 3 !== 0) {
            throw new Error(`Invalid positions length: ${positions.length}`);
        }
        if (quads.length % 4 !== 0) {
            throw new Error(`Invalid quads length: ${quads.length}`);
        }
        if (normals.length > 0 && normals.length !== positions.length) {
            throw new Error(
                `Invalid normals length: positions=${positions.length}, normals=${normals.length}`
            );
        }
        if (areaIds.length > 0 && areaIds.length !== quads.length / 4) {
            throw new Error(
                `Invalid areaIds length: areaIds=${areaIds.length}, quads=${quads.length / 4}`
            );
        }

        return { positions, quads, normals, areaIds };
    }

    const meshData = normalizeMeshData(data);

    function buildTrianglesFromQuads(quads, areaIds) {
        if (quads.length % 4 !== 0) {
            throw new Error('Invalid quads array');
        }
        const indices = [];
        const triangleAreaIds = [];

        for (let i = 0; i < quads.length; i += 4) {
            const q = i / 4;
            const areaId = areaIds.length > 0 ? areaIds[q] : q;
            const a = quads[i];
            const b = quads[i + 1];
            const c = quads[i + 2];
            const d = quads[i + 3];

            indices.push(a, b, c);
            triangleAreaIds.push(areaId);

            if (c !== d) {
                indices.push(a, c, d);
                triangleAreaIds.push(areaId);
            }
        }
        return { indices, triangleAreaIds };
    }

    const { indices, triangleAreaIds } = buildTrianglesFromQuads(meshData.quads, meshData.areaIds);

    let geometry = new THREE.BufferGeometry();

    geometry.setAttribute(
        'position',
        new THREE.BufferAttribute(new Float32Array(meshData.positions), 3)
    );

    if (meshData.normals.length > 0) {
        geometry.setAttribute(
            'normal',
            new THREE.BufferAttribute(new Float32Array(meshData.normals), 3)
        );
    } else {
        geometry.computeVertexNormals();
    }

    geometry.setIndex(indices);
    geometry = geometry.toNonIndexed();
    const vertexCount = geometry.attributes.position.count;
    const triangleCount = vertexCount / 3;
    if (triangleCount !== triangleAreaIds.length) {
        throw new Error(
            `triangleAreaIds length mismatch: triangles=${triangleCount}, areaIds=${triangleAreaIds.length}`
        );
    }

    const colorArray = new Float32Array(vertexCount * 3);
    const areaColorMap = new Map();
    const randomColorForArea = (areaId) => {
        let color = areaColorMap.get(areaId);
        if (!color) {
            color = new THREE.Color(Math.random(), Math.random(), Math.random());
            areaColorMap.set(areaId, color);
        }
        return color;
    };

    for (let t = 0; t < triangleCount; t++) {
        const areaId = triangleAreaIds[t];
        const color = randomColorForArea(areaId);
        for (let local = 0; local < 3; local++) {
            const v = t * 3 + local;
            colorArray[v * 3] = color.r;
            colorArray[v * 3 + 1] = color.g;
            colorArray[v * 3 + 2] = color.b;
        }
    }
    geometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

    const material = new THREE.MeshBasicMaterial({
        vertexColors: true,
        side: THREE.DoubleSide
    });

    // -----------------------------
    // mesh
    // -----------------------------
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    const tooltip = document.getElementById('area-tooltip');
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    window.addEventListener('mousemove', (event) => {
        pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.intersectObject(mesh, false)[0];

        if (!hit || hit.faceIndex == null) {
            tooltip.style.display = 'none';
            return;
        }

        const areaId = triangleAreaIds[hit.faceIndex];
        tooltip.textContent = `areaId: ${areaId}`;
        tooltip.style.left = `${event.clientX}px`;
        tooltip.style.top = `${event.clientY}px`;
        tooltip.style.display = 'block';
    });

    // -----------------------------
    // camera auto distance
    // -----------------------------
    geometry.computeBoundingSphere();

    if (geometry.boundingSphere) {
        const r = geometry.boundingSphere.radius;
        camera.position.set(0, 0, r * 2.5);
        controls.update();
    }

    // -----------------------------
    // render
    // -----------------------------
    function animate() {
        requestAnimationFrame(animate);

        controls.update();

        renderer.render(scene, camera);
    }

    animate();

    // -----------------------------
    // resize
    // -----------------------------
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
