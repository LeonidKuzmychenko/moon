<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sphere Atlas Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>
    <div id="info"></div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls, sphere, raycaster, mouse;
        let sphereData, userAreasData, atlasInfo, atlasImage;
        let infoDiv = document.getElementById('info');

        async function init() {
            // 1. Fetch data
            try {
                const sphereRes = await fetch('http://localhost:8080/sphere');
                const data = await sphereRes.json();
                sphereData = data.sphere.elements;
                userAreasData = data.userAreas.users;

                const atlasInfoRes = await fetch('http://localhost:8080/atlas/info');
                atlasInfo = await atlasInfoRes.json();

                atlasImage = new Image();
                atlasImage.crossOrigin = "anonymous";
                atlasImage.src = 'http://localhost:8080/atlas';
                await new Promise(resolve => atlasImage.onload = resolve);

                setupScene();
                createSphere();
                animate();
            } catch (err) {
                console.error("Failed to load data", err);
            }
        }

        function setupScene() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 2;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onClick);
            window.addEventListener('resize', onWindowResize);
        }

        function createSphere() {
            // Create a canvas texture for the sphere
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 4096;
            canvas.height = 2048;

            // Fill background
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid for areas (optional, for debugging)
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            sphereData.forEach(el => {
                const x = (el.lon / (2 * Math.PI)) * canvas.width;
                const y = (1 - (el.lat + Math.PI / 2) / Math.PI) * canvas.height;
                const w = (el.width / (2 * Math.PI)) * canvas.width;
                const h = (el.height / Math.PI) * canvas.height;
                ctx.strokeRect(x, y, w, h);
            });

            // Map user areas
            userAreasData.forEach(user => {
                user.groups.forEach(group => {
                    const info = atlasInfo.find(i => i.groupId === group.groupId);
                    if (!info) return;

                    // Find bounding box of areaIds for this group
                    const groupAreas = sphereData.filter(el => group.areaIds.includes(el.areaId));
                    if (groupAreas.length === 0) return;

                    let minLat = Infinity, maxLat = -Infinity;
                    let minLon = Infinity, maxLon = -Infinity;

                    groupAreas.forEach(el => {
                        minLat = Math.min(minLat, el.lat);
                        maxLat = Math.max(maxLat, el.lat + el.height);
                        minLon = Math.min(minLon, el.lon);
                        maxLon = Math.max(maxLon, el.lon + el.width);
                    });

                    // Convert lat/lon to canvas coords
                    const x = (minLon / (2 * Math.PI)) * canvas.width;
                    const y = (1 - (maxLat + Math.PI / 2) / Math.PI) * canvas.height;
                    const w = ((maxLon - minLon) / (2 * Math.PI)) * canvas.width;
                    const h = ((maxLat - minLat) / Math.PI) * canvas.height;

                    // Draw the tile from atlas
                    ctx.drawImage(atlasImage, info.x, info.y, info.width, info.height, x, y, w, h);
                });
            });

            const texture = new THREE.CanvasTexture(canvas);
            const geometry = new THREE.SphereGeometry(1, 64, 64);
            const material = new THREE.MeshStandardMaterial({ map: texture });
            sphere = new THREE.Mesh(geometry, material);
            scene.add(sphere);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(sphere);

            if (intersects.length > 0) {
                const point = intersects[0].uv; // UV mapping gives us relative lon/lat
                const lon = point.x * 2 * Math.PI;
                const lat = (1 - point.y) * Math.PI - Math.PI / 2;

                // Find area under cursor
                const area = sphereData.find(el => 
                    lat >= el.lat && lat <= el.lat + el.height &&
                    lon >= el.lon && lon <= el.lon + el.width
                );

                if (area) {
                    // Find group for this area
                    let foundGroup = null;
                    userAreasData.forEach(user => {
                        user.groups.forEach(group => {
                            if (group.areaIds.includes(area.areaId)) {
                                foundGroup = group;
                            }
                        });
                    });

                    if (foundGroup) {
                        infoDiv.style.display = 'block';
                        infoDiv.style.left = (event.clientX + 10) + 'px';
                        infoDiv.style.top = (event.clientY + 10) + 'px';
                        infoDiv.innerHTML = `GroupId: ${foundGroup.groupId}<br>AreaId: ${area.areaId}<br>URL: ${foundGroup.url}`;
                        document.body.style.cursor = 'pointer';
                    } else {
                        infoDiv.style.display = 'none';
                        document.body.style.cursor = 'default';
                    }
                }
            } else {
                infoDiv.style.display = 'none';
                document.body.style.cursor = 'default';
            }
        }

        function onClick(event) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(sphere);

            if (intersects.length > 0) {
                const point = intersects[0].uv;
                const lon = point.x * 2 * Math.PI;
                const lat = (1 - point.y) * Math.PI - Math.PI / 2;

                const area = sphereData.find(el => 
                    lat >= el.lat && lat <= el.lat + el.height &&
                    lon >= el.lon && lon <= el.lon + el.width
                );

                if (area) {
                    userAreasData.forEach(user => {
                        user.groups.forEach(group => {
                            if (group.areaIds.includes(area.areaId)) {
                                window.open(group.url, '_blank');
                            }
                        });
                    });
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
